[project]
name = "cabinet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # [asyncio] pulls greenlet unconditionally; SQLAlchemy's own greenlet dep
    # has a platform-marker list that misses macOS arm64, which broke the
    # PyInstaller CI build (greenlet was otherwise only a dev dependency).
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sse-starlette>=2.0",
    # Text extraction
    "pymupdf4llm>=0.0.10",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    # LLM clients
    "anthropic>=0.39",
    "openai>=1.50",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/cabinet/routers/*.py" = ["B008"]
"run_server.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cabinet"]
