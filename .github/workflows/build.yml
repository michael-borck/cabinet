name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            backend_ext: ""
          - os: ubuntu-latest
            platform: linux
            backend_ext: ""
          - os: windows-latest
            platform: win
            backend_ext: ".exe"

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies and PyInstaller
        run: |
          cd backend
          python -m pip install --upgrade pip uv
          # Install dependencies exactly as pinned in uv.lock (no fresh resolution)
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-ci.txt
          uv pip install --system -r requirements-ci.txt
          uv pip install --system --no-deps .
          pip install pyinstaller
          # Verify greenlet is installed with its C extension
          python -c "import greenlet; print(f'greenlet {greenlet.__version__} at {greenlet.__file__}')"
        shell: bash

      - name: Build Python backend with PyInstaller
        run: |
          cd backend

          # Determine platform-specific separator for --add-data
          if [ "$RUNNER_OS" == "Windows" ]; then
            SEP=";"
          else
            SEP=":"
          fi

          pyinstaller --onefile \
            --console \
            --name "cabinet-api" \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import uvicorn.lifespan.off \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.http.h11_impl \
            --hidden-import uvicorn.protocols.http.httptools_impl \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.protocols.websockets.websockets_impl \
            --hidden-import uvicorn.protocols.websockets.wsproto_impl \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.loops.asyncio \
            --hidden-import uvicorn.loops.uvloop \
            --hidden-import fastapi \
            --hidden-import pydantic \
            --hidden-import pydantic_settings \
            --hidden-import sqlalchemy \
            --hidden-import sqlalchemy.dialects.sqlite \
            --hidden-import aiosqlite \
            --hidden-import greenlet \
            --collect-all greenlet \
            --collect-binaries greenlet \
            --hidden-import sse_starlette \
            --hidden-import pymupdf \
            --hidden-import pymupdf4llm \
            --hidden-import fitz \
            --hidden-import docx \
            --hidden-import openpyxl \
            --hidden-import anthropic \
            --hidden-import openai \
            --hidden-import google.genai \
            --hidden-import python_multipart \
            --hidden-import multipart \
            --hidden-import starlette.formparsers \
            --exclude-module torch \
            --exclude-module tensorflow \
            --exclude-module keras \
            --exclude-module matplotlib \
            --exclude-module PIL \
            --exclude-module cv2 \
            --exclude-module numpy \
            --exclude-module scipy \
            --exclude-module pandas \
            run_server.py
        shell: bash

      - name: Test backend executable
        run: |
          cd backend
          echo "Testing backend executable..."
          echo "Executable size: $(ls -lh ./dist/cabinet-api${{ matrix.backend_ext }})"

          # Start server in background
          ./dist/cabinet-api${{ matrix.backend_ext }} --port 19999 > server.log 2>&1 &
          PID=$!
          echo "Started server with PID: $PID"

          # Wait for server to start (PyInstaller bundles can be slow)
          echo "Waiting for server to start..."
          for i in {1..120}; do
            if curl -s http://127.0.0.1:19999/api/v1/health > /dev/null 2>&1; then
              echo "Server is up after $i seconds!"
              break
            fi
            if ! kill -0 $PID 2>/dev/null; then
              echo "Server process died!"
              echo "=== Server log ==="
              cat server.log || true
              exit 1
            fi
            sleep 1
          done

          # Final health check
          echo "Performing health check..."
          if curl -f http://127.0.0.1:19999/api/v1/health; then
            echo ""
            echo "Health check passed!"
          else
            echo "Health check failed!"
            echo "=== Server log ==="
            cat server.log || true
            kill $PID 2>/dev/null || true
            exit 1
          fi

          kill $PID 2>/dev/null || true
        shell: bash
        continue-on-error: false

      - name: Copy backend to resources
        run: |
          mkdir -p backend-dist
          cp "backend/dist/cabinet-api${{ matrix.backend_ext }}" "backend-dist/cabinet-api${{ matrix.backend_ext }}"
          ls -la backend-dist/
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Build Electron app
        run: npx electron-vite build

      - name: Import macOS signing certificate
        # Signing secrets are not available (and must not be exposed) on pull_request builds
        if: matrix.os == 'macos-latest' && github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE: ${{ secrets.CSC_LINK }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: Package Electron app (signed)
        if: github.event_name != 'pull_request'
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # electron-builder/@electron/notarize read APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD
          # and APPLE_TEAM_ID (repo secrets use the same names)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package Electron app (unsigned, pull request)
        if: github.event_name == 'pull_request'
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # No signing identity or notarization credentials on PR builds
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.yml
            release/*.blockmap
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/latest*.yml
            artifacts/**/*.blockmap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
