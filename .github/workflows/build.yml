# Shared Electron release pipeline: michael-borck/app-hq/.github/workflows/electron-release.yml
name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: michael-borck/app-hq/.github/workflows/electron-release.yml@main
    with:
      product-name: Cabinet
      node-version: '20'
      preflight-command: npx tsc --noEmit && npm test
      build-command: npm run build
      sidecar-command: bash scripts/build-sidecar.sh
      # Each macOS runner builds its host arch (arm64 or x64) with a matching
      # sidecar. mac-intel is a local matrix label mapped by scripts/package.sh.
      matrix: |
        [
          {"os":"macos-15","platform":"mac"},
          {"os":"macos-15-intel","platform":"mac-intel"},
          {"os":"ubuntu-latest","platform":"linux"},
          {"os":"windows-latest","platform":"win"}
        ]
      package-command: bash scripts/package.sh
      post-package-command: bash scripts/notarize-dmg.sh release
      notarize-check-command: npx electron-builder --mac --publish never
      notarize-check-artifact-root: release
      signing-mode: custom
      notarize-mode: builtin
      publish-mode: artifacts
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
