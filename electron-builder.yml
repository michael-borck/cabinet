appId: com.cabinet.desktop
productName: Cabinet
copyright: Copyright © 2024 Michael Borck

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json
  # exFAT project volumes create AppleDouble metadata next to files; never
  # ship those into app.asar.
  - "!**/._*"
  - "!**/.DS_Store"

asar: true

# Bundle the Python backend executable
extraResources:
  - from: backend-dist/
    to: backend
    filter:
      - "**/*"
      - "!**/._*"
      - "!**/.DS_Store"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

mac:
  # The PyInstaller sidecar is built for one arch at a time. Keep the macOS
  # release arm64-only; an Intel build needs an x64 sidecar from an Intel
  # runner (and an x64 target here).
  target:
    - target: dmg
      arch:
        - arm64
    # electron-updater on macOS downloads the ZIP target; DMG alone breaks auto-update
    - target: zip
      arch:
        - arm64
  icon: resources/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: resources/icon.png
  category: Office

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
